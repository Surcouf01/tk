name: dancing_bidi (Fossil) tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make pkg-config git ca-certificates curl ca-certificates \
            libx11-dev libxext-dev libxft-dev libxrender-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libicu-dev xvfb fontconfig fonts-dejavu-core

      - name: Diagnostics (env, ICU)
        run: |
          {
            cat /etc/os-release | head -2
            uname -a
            pkg-config --modversion icu-uc icu-i18n || true
          } | tee /tmp/diag.log

      - name: ICU workaround (symlink to a version Tk tries)
        run: |
          ACTUAL=$(ls /usr/lib/x86_64-linux-gnu/libicuuc.so.* 2>/dev/null | grep -v '\.a$' | head -1)
          if [ -n "$ACTUAL" ]; then
            if ! ls /usr/lib/x86_64-linux-gnu/libicuuc.so.[67]? >/dev/null 2>&1; then
              sudo ln -sf "$ACTUAL" /usr/lib/x86_64-linux-gnu/libicuuc.so.79
              echo "Symlinked $ACTUAL -> libicuuc.so.79"
            fi
          fi

      - name: Build Tcl 9 (trunk)
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/tcltk/tcl.git tcl
          cd tcl/unix
          ./configure --prefix=$GITHUB_WORKSPACE/inst
          make -j$(nproc)
          make install

      - name: Fetch Tk dancing_bidi branch from Fossil
        run: |
          set -o pipefail
          curl -sL -o dancing_bidi.tar.gz \
            "https://core.tcl-lang.org/tk/tarball/dancing_bidi/dancing_bidi.tar.gz"
          tar xzf dancing_bidi.tar.gz
          ls dancing_bidi | head -20 | tee /tmp/fetch.log
          cat dancing_bidi/manifest.uuid >> /tmp/fetch.log 2>/dev/null || true

      - name: Apply TK_DEBUG_MEASURE instrumentation
        run: |
          cd dancing_bidi
          patch -p0 generic/tkTextDisp.c < $GITHUB_WORKSPACE/repo/.github/patches/dancing-diag.patch
          echo "instrumentation applied" >> /tmp/fetch.log

      - name: Build Tk (dancing_bidi, bidi)
        run: |
          set -o pipefail
          cd dancing_bidi/unix
          ./configure --with-tcl=$GITHUB_WORKSPACE/inst/lib \
                      --prefix=$GITHUB_WORKSPACE/inst --enable-bidi
          make -j$(nproc) 2>&1 | tee /tmp/tkbuild.log | tail -20

      - name: ICU availability check
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          xvfb-run -a -s "-screen 0 1280x1024x24" ./wish \
            $GITHUB_WORKSPACE/repo/.github/test-scripts/icu-check.tcl 2>&1 | tee /tmp/icu.log

      - name: "Test 1: pure-RTL layout stability under sel tag"
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          xvfb-run -a -s "-screen 0 1280x1024x24" ./wish \
            $GITHUB_WORKSPACE/repo/.github/test-scripts/rtl-tag-stability.tcl 2>&1 | tee /tmp/test1.log

      - name: "Test 2: cluster boundary snapping (pointed Hebrew)"
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          xvfb-run -a -s "-screen 0 1280x1024x24" ./wish \
            $GITHUB_WORKSPACE/repo/.github/test-scripts/cluster-gap.tcl 2>&1 | tee /tmp/test2.log

      - name: "Test 3: mixed-bidi layout stability (residual issues)"
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          xvfb-run -a -s "-screen 0 1280x1024x24" ./wish \
            $GITHUB_WORKSPACE/repo/.github/test-scripts/mixed-bidi-stability.tcl 2>&1 | tee /tmp/test3.log

      - name: "Diag: mixed-bidi bboxes and x sweep"
        if: always()
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          export TK_DEBUG_MEASURE=1
          xvfb-run -a -s "-screen 0 1280x1024x24" ./wish \
            $GITHUB_WORKSPACE/repo/.github/test-scripts/mixed-bidi-diag.tcl 2>&1 | tee /tmp/diag-mixed.log

      - name: "text.test suite (informational)"
        continue-on-error: true
        run: |
          cd dancing_bidi/unix
          export TK_LIBRARY=$GITHUB_WORKSPACE/dancing_bidi/library
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/inst/lib:$GITHUB_WORKSPACE/dancing_bidi/unix
          xvfb-run -a -s "-screen 0 1280x1024x24" make test TESTFLAGS="-file text.test" 2>&1 | tee /tmp/texttest.log | tail -20

      - name: Publish results
        if: always()
        run: |
          cd repo
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          mkdir -p .ci-logs
          cp /tmp/diag.log /tmp/fetch.log /tmp/diag-mixed.log /tmp/icu.log /tmp/test1.log /tmp/test2.log /tmp/test3.log /tmp/texttest.log /tmp/tkbuild.log .ci-logs/ 2>/dev/null || true
          cp .github/test-scripts/*.tcl .ci-logs/ 2>/dev/null || true
          git add .ci-logs
          git commit -qm "CI logs dancing_bidi ${{ github.sha }}"
          git push -qf origin HEAD:refs/heads/ci-results/dancing-bidi-fossil
